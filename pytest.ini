[pytest]
testpaths = tests
python_files = test_*.py
# training/ is a top-level package (not installed via pip, unlike
# wealthpilot) holding Phase 4+ training scripts — this makes it importable
# during test collection without installing it as a package.
pythonpath = .
# Several Phase 5 test directories share a basename (e.g. two
# test_artifacts.py, under tests/training/expense/ and .../behaviour/).
# The default "prepend" import mode requires unique basenames (or a full
# __init__.py chain, which was tried and reverted — it collided with the
# real top-level `training` package once `tests/` itself became an import
# root: `tests.training.*` shadowed genuine `training.*` imports).
# importlib mode imports each test file by its own file path instead of a
# synthesized module name, so duplicate basenames across directories need
# no special handling at all.
addopts = --import-mode=importlib
